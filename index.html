/* v4: ตัวเลือกวันที่ พ.ศ. และรายการสิทธิ์แบบหลายบุคคล */
.rights-checklist{max-height:350px;overflow:auto;border:1px solid var(--line);border-radius:12px}
.rights-checklist label{display:flex;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid #edf2f7;cursor:pointer}
.rights-checklist label:hover{background:#f4f9ff}
.rights-checklist input{width:18px;height:18px;accent-color:var(--blue)}
.rights-selected{font-size:12px;color:var(--deep);margin:12px 0}
.date-entry{display:flex;gap:7px;align-items:stretch}
.date-entry .input{min-width:0;flex:1}
.date-entry button{min-width:45px;font-size:18px}
.date-hint{font-size:11px;color:var(--mute)}
.date-pop-bg{position:fixed;inset:0;background:#0a214c75;z-index:97;display:grid;place-items:center;padding:14px}
.date-pop{max-width:370px;width:100%;background:#fff;border:1px solid var(--line);border-radius:19px;padding:17px;box-shadow:0 18px 65px #092a4c4c}
.date-pop-header{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-bottom:10px}
.date-pop-week,.date-pop-days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;text-align:center}
.date-pop-week span{font-size:12px;color:var(--mute);padding:7px 1px}
.date-pop-days button{border:0;border-radius:8px;background:#f1f6ff;color:var(--deep);height:38px;padding:2px;font-size:13px}
.date-pop-days button:hover,.date-pop-days button.selected{background:var(--blue);color:#fff}
.date-pop-days button.today:not(.selected){outline:2px solid var(--gold)}
.date-pop-days .blank{height:38px}
.date-pop-actions{margin-top:12px;display:flex;justify-content:space-between;gap:8px}
@media(max-width:780px){.date-pop{padding:13px}.date-pop-days button{height:40px}}

/* v13: เลือกคาบสอนแทนหลายคาบและขั้นตอนอนุมัติ */
.sub-periods{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:8px;margin:8px 0}
.sub-periods label{display:flex;gap:9px;align-items:center;border:1px solid #d7e3f1;border-radius:11px;padding:11px;cursor:pointer;background:#f9fbfe}
.sub-periods label:has(input:checked){border-color:#2784d7;background:#eaf4ff}
.sub-periods input{width:18px;height:18px;accent-color:var(--blue)}
.sub-score-hint{border:1px solid #b6d8f4;background:#eef7ff;border-radius:12px;padding:12px 14px;margin:10px 0;line-height:1.75}
.sub-history-status{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
/* v8: ประวัติการสอนแทน — แก้ไข / ลบ อย่างชัดเจน */
.grid2>.card{min-width:0}
.grid2 .table-wrap{max-width:100%}
.sub-history-actions{display:flex;flex-wrap:wrap;align-items:center;gap:7px}
.sub-history-actions .btn{white-space:nowrap;min-width:70px}
.sub-edit-banner{background:#fff6d7;border:1px solid #f4d66a;color:#5d4811;padding:12px 14px;border-radius:12px;margin-bottom:13px;font-size:13px;line-height:1.7}
@media(max-width:780px){.sub-history-actions .btn{min-width:68px}.sub-history-actions{gap:6px}}
/* v11: รายงานผลงาน 2 ประเภทและภาพตัวอย่างหลักฐานรางวัล */
.work-kind-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 14px}
.work-kind-tabs .tab{flex:1;min-width:180px;white-space:normal;line-height:1.5}
.award-preview{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-top:10px}
.award-preview figure{margin:0;background:#edf5fd;border:1px solid #d1e2f5;border-radius:11px;overflow:hidden;min-width:0}
.award-preview img{width:100%;height:122px;object-fit:cover;display:block}
.award-preview figcaption{font-size:11px;padding:5px 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.award-points{padding:11px 13px;background:#edf8ff;border-left:4px solid #126cba;border-radius:8px;color:#16456e;margin:10px 0}
.work-form-panel[hidden]{display:none!important}
@media(max-width:520px){.award-preview{grid-template-columns:repeat(2,minmax(0,1fr))}.award-preview img{height:112px}}
/* v15 ชั้น/ห้องและคาบของวันเดียวกัน */
.sub-room-group{padding:10px 12px;border:1px solid #d5e5f5;background:#f5faff;border-radius:11px;margin-bottom:9px}
.sub-room-group>b{display:block;margin-bottom:8px;color:#185a8b}
.sub-room-group .sub-periods{display:flex;flex-wrap:wrap;gap:8px;max-height:none}
.sub-room-group .sub-periods label{min-width:85px}
#sub-period-list{display:block}
@media(max-width:620px){.sub-room-group{min-width:0}.sub-room-group .sub-periods{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.sub-room-group .sub-periods label{min-width:0;padding:9px}}

/* v17 - กรองรายวิชาของผู้เข้าสู่ระบบตามวันที่สอนแทน */
.sub-proof-preview{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:9px;margin:9px 0}
.sub-proof-preview figure{margin:0;border:1px solid #c9dfed;background:#f2f8ff;border-radius:10px;overflow:hidden;min-width:0}
.sub-proof-preview img{width:100%;height:115px;object-fit:cover;display:block}
.sub-proof-preview figcaption{padding:5px 7px;font-size:11px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.sub-evidence-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px;margin:10px 0}
.sub-evidence-grid a{display:block;border:1px solid #caddec;border-radius:10px;overflow:hidden;background:#edf5fd}
.sub-evidence-grid img{display:block;width:100%;height:120px;object-fit:cover}
.sub-evidence-grid small{display:block;padding:4px 6px;font-size:11px}
.sub-reason{white-space:pre-wrap;overflow-wrap:anywhere}
@media(max-width:520px){.sub-proof-preview{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* v19 activity attendance and daily duties */
.duty-check{display:flex;flex-wrap:wrap;gap:10px;margin:9px 0 16px}
.duty-check label{background:#f1f7ff;border:1px solid #cadcef;padding:9px 13px;border-radius:11px;display:flex;gap:7px;align-items:center}
.duty-table select{min-width:126px;width:100%;padding:7px;border:1px solid #d0dce8;border-radius:8px;background:white;color:#123e66}
.duty-table td{vertical-align:middle}
.duty-roster-list{max-height:345px;overflow:auto;border:1px solid #d5e1ed;border-radius:12px}
.duty-roster-list label{padding:10px;display:flex;gap:12px;align-items:center;border-bottom:1px solid #e8edf4}
@media(max-width:600px){.duty-table th,.duty-table td{font-size:12px;padding:9px 5px}.duty-table select{min-width:119px}}
.roster-import-info{overflow-wrap:anywhere}@media(max-width:600px){.duty-roster-list{max-height:280px}.duty-check{display:grid;grid-template-columns:1fr 1fr}.duty-check label{min-width:0;font-size:13px}}

// JSONP แบบจำกัด concurrent requests: ลด burst ที่ทำให้ Apps Script รอคิว
const NS_JSONP_LIMIT=3;
const NS_JSONP_READS=new Set(['ping','init','readScores','listSchedule','getDutyData','readDutyRoster','readPermissions']);
const NS_JSONP_INFLIGHT=new Map();
const NS_JSONP_QUEUE=[];
let NS_JSONP_RUNNING=0;
function pumpJSONP(){
 while(NS_JSONP_RUNNING<NS_JSONP_LIMIT&&NS_JSONP_QUEUE.length){
  const job=NS_JSONP_QUEUE.shift();NS_JSONP_RUNNING++;
  sendJSONP(job.action,job.body).then(job.resolve,job.reject).finally(()=>{NS_JSONP_RUNNING--;pumpJSONP()});
 }
}
function externalJSONP(action,body){
 const fingerprint=NS_JSONP_READS.has(action)?action+':'+JSON.stringify(body):null;
 if(fingerprint&&NS_JSONP_INFLIGHT.has(fingerprint))return NS_JSONP_INFLIGHT.get(fingerprint);
 const request=new Promise((resolve,reject)=>{NS_JSONP_QUEUE.push({action,body,resolve,reject});pumpJSONP()});
 if(fingerprint){NS_JSONP_INFLIGHT.set(fingerprint,request);request.then(()=>NS_JSONP_INFLIGHT.delete(fingerprint),()=>NS_JSONP_INFLIGHT.delete(fingerprint));}
 return request;
}
function sendJSONP(action,body){
 return new Promise((resolve,reject)=>{
  const callback='NSCB_'+Date.now()+'_'+Math.random().toString(36).slice(2);
  const script=document.createElement('script');
  const start=performance.now();let completed=false;
  const timer=setTimeout(()=>finish(Error('เซิร์ฟเวอร์ตอบสนองช้าเกินไป กรุณาตรวจการเชื่อมต่อแล้วลองอีกครั้ง')),60000);
  function finish(error,data){
   if(completed)return;completed=true;
   clearTimeout(timer);try{delete window[callback];script.remove()}catch(_){ }
   S.lastRttMs=Math.round(performance.now()-start);S.lastServerMs=null;S.lastPerf=null;
   error?reject(error):resolve(data);
  }
  window[callback]=answer=>answer?.ok?finish(null,answer.data):finish(Error(answer?.error||'ระบบไม่ตอบกลับ'));
  script.onerror=()=>finish(Error('เชื่อมต่อ Google Apps Script ไม่สำเร็จ กรุณาตรวจ URL และการ Deploy'));
  const url=new URL(API_URL);
  url.searchParams.set('action',action);url.searchParams.set('callback',callback);
  url.searchParams.set('data',JSON.stringify(body));
  script.src=url.toString();script.async=true;
  document.head.appendChild(script);
 });
}

function dateTH(v){

 const t=String(v).trim();
 let m=t.match(/^(\d{4})-(\d{2})-(\d{2})/);
 if(m){const year=Number(m[1]);return `${m[3]}/${m[2]}/${year>=2400?year:year+543}`;}
 m=t.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
 if(m){const year=Number(m[3]);return `${pad2(m[1])}/${pad2(m[2])}/${year<2400?year+543:year}`;}
 return t;
}
function parseThaiDate(value,optional=false){
 const v=String(value||'').trim();if(!v){if(optional)return '';throw Error('กรุณาระบุวันที่ในรูปแบบ วว/ดด/พ.ศ.');}
 let m=v.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
 if(!m)throw Error('รูปแบบวันที่ไม่ถูกต้อง กรุณากรอก วว/ดด/พ.ศ. เช่น 09/10/2569');
 const day=Number(m[1]),month=Number(m[2]),be=Number(m[3]),year=be-543;
 if(be<2400||be>2900||year<1900||year>2357)throw Error('กรุณาระบุปี พ.ศ. ให้ถูกต้อง');
 const d=new Date(year,month-1,day);
 if(d.getFullYear()!==year||d.getMonth()!==month-1||d.getDate()!==day)throw Error('วันที่ไม่ถูกต้องตามปฏิทิน');
 return `${year}-${pad2(month)}-${pad2(day)}`;

function subProofLinks(x){
 const links=Array.isArray(x?.proofs)?x.proofs:[];
 if(!links.length)return '<p class="muted">ไม่พบรูปหลักฐาน (ข้อมูลก่อนการปรับปรุง)</p>';
 return `<div class="sub-evidence-grid">${links.map((url,i)=>`<a href="${attr(url)}" target="_blank" rel="noopener noreferrer" title="เปิดหลักฐานรูปที่ ${i+1}"><img src="${attr(url)}" alt="หลักฐานประกอบการมอบหมายรูปที่ ${i+1}" loading="lazy"><small>หลักฐาน ${i+1}</small></a>`).join('')}</div>`;
}

function searchedCourses(){
 const q=S.subSearch.trim().toLocaleLowerCase('th'),day=subDayIndex();
 if(day<0)return [];
 // เซิร์ฟเวอร์ส่งเฉพาะรายวิชาของผู้เข้าสู่ระบบ และฝั่งเว็บตรวจชื่อซ้ำอีกชั้น
 const ownName=x=>String(x||'').normalize('NFKC').replace(/[\s\u200b-\u200d\ufeff]+/g,'');
 const username=ownName(S.data?.user?.name);
 return (S.data?.schedule||[]).filter(x=>username&&ownName(x.owner)===username&&
   (x.periodsByDay?.[String(day)]||[]).length&&(!q||String(x.code).toLocaleLowerCase('th').includes(q)||String(x.course).toLocaleLowerCase('th').includes(q)));
}
function courseSearchCount(){
 const iso=subDateISO();if(!iso)return 'กรุณาระบุวันที่สอนแทนที่ถูกต้องก่อนเลือกรหัสวิชา';
 const n=searchedCourses().length;return n?`พบรายวิชาที่คุณสอน ${n} รายการในวัน${WEEKDAY_TH[subDayIndex()]}${n>150?' (แสดง 150 รายการแรก)':''}`:`ไม่พบรายวิชาของคุณในวัน${WEEKDAY_TH[subDayIndex()]}${S.subSearch.trim()?'ที่ตรงกับคำค้นหา':''} กรุณาตรวจสอบชื่อ-สกุลในข้อมูลผู้ใช้ให้ตรงกับตารางสอน`;
}
function courseOptions(){
 const results=searchedCourses(),selected=S._subKey,shown=results.slice(0,150);
 if(selected&&!shown.some(x=>x.key===selected)){const match=results.find(x=>x.key===selected);if(match)shown.unshift(match)}
 return '<option value="">-- เลือกรหัสวิชา --</option>'+shown.map(x=>`<option value="${attr(x.key)}" ${x.key===selected?'selected':''}>${esc(x.code)} · ${esc(x.course)}${x.owner?' ('+esc(x.owner)+')':''}</option>`).join('');
}
NS.searchCourse=q=>{S.subSearch=q;const sel=$('sub-code');if(!sel)return;const previous=sel.value||S._subKey;sel.innerHTML=courseOptions();sel.value=[...sel.options].some(o=>o.value===previous)?previous:'';$('sub-search-count').textContent=courseSearchCount();NS.showCourse()};
// เมื่อเปลี่ยนวันที่หรือรายวิชา ให้ล้างการเลือกชั้น/ห้องและคาบ เพื่อป้องกันใช้ข้อมูลข้ามวัน
NS.subDateChanged=()=>{
 const iso=subDateISO();
 if(S._subDateISO!==iso){S._subDateISO=iso;S.subRooms.clear();S.subSlots.clear()}
 const sel=$('sub-code');if(!sel)return;
 const previous=S._subKey;sel.innerHTML=courseOptions();
 sel.value=[...sel.options].some(o=>o.value===previous)?previous:'';
 $('sub-search-count').textContent=courseSearchCount();NS.showCourse();
};
NS.showCourse=()=>{
 const key=val('sub-code'),previous=S._subKey;
 if(previous!==key){S.subRooms.clear();S.subSlots.clear()}S._subKey=key;
 const x=selectedSchedule(),info=$('course-info'),roomList=$('sub-room-list'),periodList=$('sub-period-list');
 if(!info||!roomList||!periodList)return;
 const iso=subDateISO(),day=subDayIndex(),rooms=subRoomsForDay(x),roomNames=Object.keys(rooms);
 info.innerHTML=x?`<b>วิชา:</b> ${esc(x.course)}<br><b>ครูเจ้าของวิชา:</b> ${esc(x.owner)}<br><b>วันที่:</b> ${esc(subDateDisplay(iso))} (วัน${WEEKDAY_TH[day]})<br><b>ชั้น/ห้องของวันนั้น:</b> ${roomNames.length?esc(roomNames.join(', ')):'ไม่มีชั้น/ห้อง'}`:
  iso?`<b>วัน${WEEKDAY_TH[day]} (${esc(subDateDisplay(iso))})</b><br>เลือกรหัสวิชาเพื่อแสดงเฉพาะชั้น/ห้องและคาบของวันนี้`:'กรุณาระบุวันที่สอนแทนให้ถูกต้องก่อนเลือกรหัสวิชา';
 roomList.innerHTML=!iso?'<span class="muted">กรุณาระบุวันที่ก่อน</span>':!x?'<span class="muted">กรุณาเลือกรหัสวิชา</span>':roomNames.length?roomNames.map(room=>`<label><input type="checkbox" ${S.subRooms.has(room)?'checked':''} onchange="NS.toggleSubRoom('${encodeURIComponent(room)}',this.checked)"><span>${esc(room)} <small class="muted">(${rooms[room].length} คาบ)</small></span></label>`).join(''):'<span class="muted">ไม่มีชั้น/ห้องในวันดังกล่าว</span>';
 NS.renderSubPeriods();
};
NS.renderSubPeriods=()=>{
 const rooms=subRoomsForDay(selectedSchedule()),out=$('sub-period-list');if(!out)return;
 const chosen=Object.keys(rooms).filter(room=>S.subRooms.has(room));
 out.innerHTML=chosen.length?chosen.map(room=>`<div class="sub-room-group"><b>${esc(room)}</b><div class="sub-periods">${rooms[room].map(period=>`<label><input type="checkbox" ${S.subSlots.has(subSlotKey({room,period}))?'checked':''} onchange="NS.toggleSubPeriod('${encodeURIComponent(room)}','${encodeURIComponent(period)}',this.checked)"><span>คาบ ${esc(period)}</span></label>`).join('')}</div></div>`).join(''):'<span class="muted">เลือกชั้น/ห้องด้านบนก่อน จึงจะแสดงคาบของแต่ละชั้น/ห้อง</span>';
 NS.updateSubPoints();
};
NS.toggleSubRoom=(encoded,on)=>{
 const room=decodeURIComponent(encoded),rooms=subRoomsForDay(selectedSchedule());if(!Object.prototype.hasOwnProperty.call(rooms,room))return;
 if(on){S.subRooms.add(room);rooms[room].forEach(period=>S.subSlots.add(subSlotKey({room,period})))}
 else{S.subRooms.delete(room);rooms[room].forEach(period=>S.subSlots.delete(subSlotKey({room,period})))}
 NS.showCourse();
};
NS.toggleSubPeriod=(encodedRoom,encodedPeriod,on)=>{
 const room=decodeURIComponent(encodedRoom),period=decodeURIComponent(encodedPeriod),rooms=subRoomsForDay(selectedSchedule());
 if(!S.subRooms.has(room)||!(rooms[room]||[]).includes(period))return;
 const key=subSlotKey({room,period});on?S.subSlots.add(key):S.subSlots.delete(key);NS.updateSubPoints();
};
NS.selectAllSubPeriods=on=>{
 const rooms=subRoomsForDay(selectedSchedule());
 Object.keys(rooms).filter(room=>S.subRooms.has(room)).forEach(room=>rooms[room].forEach(period=>{const key=subSlotKey({room,period});on?S.subSlots.add(key):S.subSlots.delete(key)}));
 NS.renderSubPeriods();
};
NS.updateSubPoints=()=>{
 const slots=selectedSubSlots(),rate=Number(S.data.subCriterion?.score)||0,el=$('sub-score-hint');
 if(el)el.innerHTML=`<b>เลือกแล้ว ${new Set(slots.map(x=>x.room)).size} ชั้น/ห้อง · ${slots.length} คาบสอน</b> × ${rate.toLocaleString('th-TH')} คะแนน/คาบ = <b>${(slots.length*rate).toLocaleString('th-TH')} คะแนน</b><br><small>นับแต่ละคู่ชั้น/ห้องและคาบแยกกัน คะแนนจะได้รับต่อเมื่อผ่านพิจารณา</small>`;
};
NS.saveSub=async()=>{
 if(S.busy)return;let date;try{date=parseThaiDate(val('sub-date'))}catch(e){NS.toast(e.message,true);return}
 const sch=selectedSchedule(),slots=selectedSubSlots();
 const previous=S.subId?(S.data.subs||[]).find(x=>x.id===S.subId):null;
 const files=[...($('sub-proofs')?.files||[])];
 const d={id:S.subId||'',date,scheduleKey:sch?.key||'',code:sch?.code||'',teacherGroup:val('sub-teacher-group'),username:val('sub-user'),slots,assignmentReason:val('sub-assignment-reason').trim(),proofs:previous?.proofs||[]};
 if(!sch){NS.toast('กรุณาเลือกรหัสวิชาที่คุณสอนตรงกับวันที่เลือก',true);return}
 const selfName=x=>String(x||'').normalize('NFKC').replace(/[\s\u200b-\u200d\ufeff]+/g,'');
 if(selfName(sch.owner)!==selfName(S.data.user.name)){NS.toast('เลือกรายวิชาได้เฉพาะวิชาของผู้เข้าสู่ระบบ',true);return}
 if(!slots.length){NS.toast('กรุณาเลือกชั้น/ห้องและคาบสอนแทนอย่างน้อย 1 รายการ',true);return} 
 if(!d.teacherGroup||!d.username||!S.data.users.some(u=>u.username===d.username&&u.group===d.teacherGroup)){NS.toast('กรุณาเลือกกลุ่มสาระและครูผู้สอนแทนให้ตรงกัน',true);return}
 if(!d.assignmentReason){NS.toast('กรุณาระบุเหตุผลที่ต้องมอบหมายให้สอนแทน',true);return}
 if(files.length>5||files.some(f=>!f.type.startsWith('image/'))||(!files.length&&!d.proofs.length)){NS.toast('กรุณาแนบภาพหลักฐาน 1–5 รูป (หรือใช้หลักฐานเดิมในการแก้ไข)',true);return}
 const edited=!!d.id;NS.busy(true,edited?'กำลังแก้ไขและส่งพิจารณา...':'กำลังบันทึกคำขอสอนแทน...');
 try{
  if(files.length){d.proofs=await uploadPhotosFast(files)}
  await api('saveSub',d);NS.clearSubProofPreview();S.subId='';S._subKey='';S._subDateISO='';S.subSearch='';S.subTeacherUsername='';S.subRooms.clear();S.subSlots.clear();S.data=await api('init');NS.render();NS.toast('บันทึกแล้ว: รอผู้มีสิทธิ์พิจารณา (คะแนนจะเข้าครูผู้สอนแทนเมื่ออนุมัติ)')}
 catch(e){NS.toast(e.message,true)}finally{NS.busy(false)}
};
NS.cancelSub=()=>{NS.clearSubProofPreview();S.subId='';S._subKey='';S._subDateISO='';S.subSearch='';S.subTeacherUsername='';S.subRooms.clear();S.subSlots.clear();NS.render()};
NS.editSub=id=>{
 id=decodeURIComponent(id);const x=S.data.subs.find(v=>String(v.id)===id);
 if(!x){NS.toast('ไม่พบรายการสอนแทน กรุณาโหลดข้อมูลใหม่',true);return}
 if(!((S.data.schedule||[]).some(v=>v.code===x.code&&v.course===x.course&&v.owner===x.owner))){
   NS.toast('ไม่สามารถแก้ไขรายการนี้ได้: รายวิชาไม่ตรงกับผู้เข้าสู่ระบบหรือไม่อยู่ในตารางสอนล่าสุด',true);return;
 }
 S.subId=id;const sch=(S.data.schedule||[]).find(a=>a.code===x.code&&a.course===x.course&&a.owner===x.owner);
 S._subKey=sch?.key||'';S._subDateISO=x.date;S.subSearch=x.code;S.subTeacherGroup=substituteGroupFor(x);S.subTeacherUsername=x.username;NS.clearSubProofPreview();
 const roomMap=sch?.roomsByDay?.[String(new Date(x.date+'T00:00:00Z').getUTCDay())]||{};
 const valid=x.slots||[];S.subRooms=new Set(valid.filter(slot=>(roomMap[slot.room]||[]).includes(slot.period)).map(slot=>slot.room));
 S.subSlots=new Set(valid.filter(slot=>(roomMap[slot.room]||[]).includes(slot.period)).map(subSlotKey));
 NS.render();NS.showCourse();$('sub-editor')?.scrollIntoView({behavior:'smooth',block:'start'});
};
NS.deleteSub=async id=>{

// รายงานรายบุคคล: คะแนนสุทธิเป็นผลรวมคะแนนที่เพิ่มและคะแนนที่หักเท่านั้น
// รายการด้านลบจะแสดงเฉพาะเมื่อมีการหักจริงภายในช่วงวันที่ของรายงาน
function individualReport(u){
  const scores=scoresInPeriod(u.username);
  const summary=totals(scores);
  const total=summary.adjustment;
  const r=rating(total);
  let index=0;
  const categoryNames=[...new Set([...S.data.categories,...scores.map(x=>x.category).filter(Boolean)])];
  const detailRows=categoryNames.map(cat=>{
    const configured=S.data.criteria.filter(c=>c.category===cat);
    const knownItems=new Set(configured.map(c=>c.item));
    const visible=configured.filter(c=>Number(c.score)>=0 || scores.some(x=>x.category===cat&&x.item===c.item&&Number(x.score)<0));
    // คะแนนที่ถูกบันทึกแล้วแต่เกณฑ์ถูกลบ/เปลี่ยนภายหลัง ยังคงปรากฏในประวัติรายงาน
    const historic=[...new Set(scores.filter(x=>x.category===cat&&!knownItems.has(x.item)).map(x=>x.item))]
      .map(item=>{const dr=(S.data.dutyRules||[]).find(x=>x.category===cat&&x.item===item);return {item,score:dr?dr.per:null};});
    const items=[...visible,...historic];
    if(!items.length)return '';
    // คอลัมน์ “คะแนน” ในแถวหมวด = คะแนนเต็มรายหมวดจากหน้าตั้งค่าของ SuperAdmin
    // ใช้ข้อมูลตั้งค่าคะแนนเต็มโดยตรง ไม่ใช่ผลรวมคะแนนจากรายการเกณฑ์
    const categoryMaximum=S.data.maximums.find(m=>String(m.category).trim()===cat.trim());
    const categoryFullScore=categoryMaximum ? (Number(categoryMaximum.max)||0) : 0;
    // คอลัมน์ “คะแนนที่ได้” ในแถวหมวด = คะแนนเพิ่มและคะแนนหักที่เกิดขึ้นจริงในช่วงรายงาน
    const categoryEarned=scores.filter(x=>x.category===cat)
      .reduce((sum,x)=>sum+(Number(x.score)||0),0);
    const categoryLabel=/^ด้าน/.test(cat.trim())?cat:'ด้าน'+cat;
    const rows=items.map(c=>{
      const gained=scores.filter(x=>x.category===cat&&x.item===c.item)
        .reduce((sum,x)=>sum+(Number(x.score)||0),0);
      const criterionScore=c.score===null?'—':Number(c.score).toLocaleString('th-TH');
      return `<tr><td class="r-num">${++index}</td><td>${esc(c.item)}</td><td class="r-num">${criterionScore}</td><td class="r-num">${gained.toLocaleString('th-TH')}</td></tr>`;
    }).join('');
    return `<tr class="report-category"><td colspan="2"><b>${esc(categoryLabel)}</b></td><td class="r-num">${categoryFullScore.toLocaleString('th-TH')}</td><td class="r-num">${categoryEarned.toLocaleString('th-TH')}</td></tr>${rows}`;
  }).join('');
  return `<section class="report-sheet report-individual">${reportHeading('ผลการประเมินผลการปฏิบัติงานข้าราชการครูและบุคลากรทางการศึกษา')}${reportDates()}<div class="r-meta"><b>ชื่อ-สกุล:</b> ${esc(u.name)} &nbsp; <b>ตำแหน่ง:</b> ${esc(u.position||'-')}<br><b>กลุ่มสาระการเรียนรู้ / สายงาน:</b> ${esc(u.group||'-')}</div><table><thead><tr><th class="r-num" style="width:48px">ลำดับ</th><th>รายการประเมิน</th><th class="r-num" style="width:75px">คะแนน</th><th class="r-num" style="width:75px">คะแนนที่ได้</th></tr></thead><tbody>${detailRows||'<tr><td colspan="4" class="r-empty">ไม่พบเกณฑ์หรือรายการคะแนนในช่วงวันที่เลือก</td></tr>'}</tbody></table><div class="score-total">คะแนนเพิ่ม ${summary.plus.toLocaleString('th-TH')} − คะแนนที่ถูกหัก ${Math.abs(summary.minus).toLocaleString('th-TH')} = คะแนนรวมสุทธิ ${total.toLocaleString('th-TH')} คะแนน</div><div class="rating"><b>ผลการประเมิน: ระดับ ${r.level} (${r.name})</b><br>${esc(r.text)}</div><div class="r-meta" style="margin-top:55px;display:flex;justify-content:space-around"><div>ลงชื่อ................................................ผู้รับการประเมิน</div><div>ลงชื่อ................................................ผู้ประเมิน</div></div></section>`;
}
function overviewReport(mode){const arr=scoreSummary(reportUsers()).sort((a,b)=>b.score-a.score);const rows=mode==='rank'?arr.map((x,i)=>[String(i+1),esc(x.u.name),esc(x.u.group),x.score.toLocaleString('th-TH'),rating(x.score).name]):[5,4,3,2,1].flatMap(level=>arr.filter(x=>rating(x.score).level===level).map(x=>[String(level),esc(x.u.name),esc(x.u.group),x.score.toLocaleString('th-TH'),rating(x.score).name]));return `<section class="report-sheet report-overview">${reportHeading(mode==='rank'?'รายงานผลการประเมินตามอันดับคะแนน':'รายงานผลการประเมินตามกลุ่มระดับคะแนน')}${reportDates()}<p class="r-meta">จำนวนบุคลากร: ${arr.length} คน</p>${renderTable([mode==='rank'?'อันดับ':'ระดับ','ชื่อ-สกุล','กลุ่มสาระ / สายงาน','คะแนนที่ได้','ผลการประเมิน'],rows)}<div class="r-meta" style="margin-top:45px;text-align:right">ลงชื่อ................................................ผู้รับรองรายงาน</div></section>`}
NS.printReports=()=>{let a,b;try{a=isoFrom('report-start');b=isoFrom('report-end');if(a&&b&&a>b)throw Error('วันที่เริ่มต้นต้องไม่เกินวันที่สิ้นสุด')}catch(e){NS.toast(e.message,true);return}S._reportStart=a;S._reportEnd=b;S.reportGroup=val('report-group');let html;if(S.reportType==='individual'){const users=S.data.users.filter(x=>S.reportSelected.has(x.username));if(!users.length){NS.toast('กรุณาเลือกบุคลากรอย่างน้อย 1 คน',true);return}html=users.map(individualReport).join('')}else html=overviewReport(S.reportType);$('report-preview').innerHTML=html;$('print-root').innerHTML=html;setTimeout(()=>window.print(),400)};

function assignedForStaff(username){return new Set((S.data.scoreAssignments||[]).filter(a=>a.username===username).map(a=>a.id));}
function assignmentAllowedCriteria(){const names=[...S.assignmentSelected],users=S.data.users.filter(u=>names.includes(u.username));if(!users.length)return [];return S.data.criteria.filter(c=>users.every(u=>!S.data.categories.includes(u.role)||u.role===c.category));}
function assignmentStaffRows(){return assignmentStaff().map(u=>`<label><input type="checkbox" ${S.assignmentSelected.has(u.username)?'checked':''} onchange="NS.assignmentPickStaff('${encodeURIComponent(u.username)}',this.checked)"><span style="flex:1"><b>${esc(u.name)}</b><br><small class="muted">${esc(u.group||'-')} · ${esc(u.role)}</small></span><span class="pill">${(S.data.scoreAssignments||[]).filter(a=>a.username===u.username).length} รายการ</span></label>`).join('')||'<div class="empty">ไม่พบรายชื่อบุคลากร</div>'}
function assignmentCriterionRows(){const criteria=assignmentAllowedCriteria();if(!S.assignmentSelected.size)return '<div class="empty">เลือกบุคลากรอย่างน้อย 1 คน เพื่อแสดงรายการเกณฑ์คะแนนตามบทบาท</div>';if(!criteria.length)return '<div class="alert">ไม่พบเกณฑ์คะแนนที่ตรงกันสำหรับบทบาทของรายชื่อที่เลือก กรุณาเลือกบุคลากรที่มีบทบาทเดียวกัน หรือตั้งค่าเกณฑ์คะแนนก่อน</div>';return S.data.categories.filter(cat=>criteria.some(c=>c.category===cat)).map(cat=>`<div style="border:1px solid var(--line);border-radius:12px;padding:12px;margin:9px 0"><b style="color:var(--deep)">${esc(cat)}</b><div class="checklist">${criteria.filter(c=>c.category===cat).map(c=>`<label><input type="checkbox" ${S.assignmentCriteria.has(c.id)?'checked':''} onchange="NS.assignmentPickCriterion('${c.id}',this.checked)"><span style="flex:1">${esc(c.item)}<br><small class="muted">${c.score>=0?'คะแนนด้านบวก':'คะแนนด้านลบ'}</small></span>${scoreLabel(c.score)}</label>`).join('')}</div></div>`).join('')}
function renderScoreAssign(){return `<div class="grid2"><div class="card"><h2>1. เลือกบุคลากรผู้บันทึกคะแนน (หลายคนได้)</h2><p class="muted" style="margin-bottom:12px">ค้นหาชื่อหรือเลือกกลุ่มสาระ แล้วติ๊กบุคลากรที่ต้องการกำหนดรายการเกณฑ์คะแนน</p><label class="field"><span>กลุ่มสาระการเรียนรู้ / สายงาน</span>${select('asg-group',groups(),S.assignmentGroup,'ทุกกลุ่มสาระ')}</label><label class="field"><span>ค้นหาชื่อ-สกุล / ชื่อผู้ใช้</span><input class="input" id="asg-search" value="${attr(S.assignmentSearch)}" placeholder="พิมพ์ชื่อหรือชื่อผู้ใช้" oninput="NS.assignmentSearchChanged(this.value)"></label><div class="row" style="margin-bottom:10px">${btn('กรองรายชื่อ','NS.assignmentFilter()')}${btn('เลือกทั้งหมดที่ค้นพบ','NS.assignmentSelectVisible()','soft')}${btn('ล้างการเลือก','NS.assignmentClear()','gray')}</div><div class="checklist" id="asg-staff-list">${assignmentStaffRows()}</div><div class="line"></div><b>เลือกแล้ว ${S.assignmentSelected.size} คน</b><div style="margin-top:8px">${[...S.assignmentSelected].map(name=>`<span class="tag">${esc(S.data.users.find(u=>u.username===name)?.name||name)}</span>`).join('')}</div></div><div class="card"><h2>2. กำหนดหมวดหมู่และรายการเกณฑ์คะแนน</h2><div class="alert">รายการเกณฑ์แสดงตามบทบาทของผู้ที่เลือก หากเลือกหลายบทบาทพร้อมกัน จะแสดงเฉพาะหมวดที่ทุกคนมีสิทธิ์บันทึก และผู้ใช้ต้องมีสิทธิ์ “บันทึกคะแนน” จากแท็บกำหนดสิทธิด้วย</div><div id="asg-criteria-list">${assignmentCriterionRows()}</div><div class="line"></div><p id="asg-count" class="muted" style="margin-bottom:12px">เลือก ${S.assignmentCriteria.size} เกณฑ์ สำหรับ ${S.assignmentSelected.size} คน</p><button class="btn gold full" ${!S.assignmentSelected.size?'disabled':''} onclick="NS.assignmentSave()">บันทึกการกำหนดรายการเกณฑ์คะแนน</button><p class="muted" style="margin-top:10px;font-size:12px">การบันทึกจะใช้ชุดเกณฑ์ที่ติ๊กแทนชุดเดิมของบุคลากรที่เลือกเท่านั้น ไม่กระทบผู้อื่น หากไม่ติ๊กเกณฑ์เลยจะเป็นการยกเลิกสิทธิ์ทั้งหมดของรายชื่อที่เลือก</p></div></div>`}
NS.assignmentSearchChanged=q=>{S.assignmentSearch=q;const root=$('asg-staff-list');if(root)root.innerHTML=assignmentStaffRows()};
NS.assignmentFilter=()=>{S.assignmentGroup=val('asg-group');S.assignmentSearch=val('asg-search');NS.render()};
NS.assignmentSync=()=>{const names=[...S.assignmentSelected];const allowed=new Set(assignmentAllowedCriteria().map(c=>c.id));S.assignmentCriteria=new Set([...allowed].filter(id=>names.every(n=>assignedForStaff(n).has(id))));};
NS.assignmentPickStaff=(encoded,checked)=>{const n=decodeURIComponent(encoded);checked?S.assignmentSelected.add(n):S.assignmentSelected.delete(n);NS.assignmentSync();NS.render()};
NS.assignmentSelectVisible=()=>{assignmentStaff().forEach(u=>S.assignmentSelected.add(u.username));NS.assignmentSync();NS.render()};
NS.assignmentClear=()=>{S.assignmentSelected.clear();S.assignmentCriteria.clear();NS.render()};
NS.assignmentPickCriterion=(id,checked)=>{checked?S.assignmentCriteria.add(id):S.assignmentCriteria.delete(id);const c=$('asg-count');if(c)c.textContent=`เลือก ${S.assignmentCriteria.size} เกณฑ์ สำหรับ ${S.assignmentSelected.size} คน`};
NS.assignmentSave=async()=>{const names=[...S.assignmentSelected],ids=[...S.assignmentCriteria];if(!names.length){NS.toast('กรุณาเลือกบุคลากร',true);return}if(!confirm(ids.length?`ยืนยันกำหนด ${ids.length} เกณฑ์ ให้บุคลากร ${names.length} คน? (แทนที่การกำหนดเดิม)`:`ยืนยันยกเลิกเกณฑ์ที่กำหนดไว้ทั้งหมดของบุคลากร ${names.length} คน?`))return;NS.busy(true);try{let saved=0;for(let i=0;i<names.length;i+=10){await api('assignScoreCriteria',{usernames:names.slice(i,i+10),criteriaIds:ids});saved+=names.slice(i,i+10).length;}S.data=await api('init');NS.assignmentSync();NS.render();NS.toast('บันทึกการกำหนดเกณฑ์สำเร็จ '+saved+' คน')}catch(e){NS.toast('บันทึกไม่ครบทุกคน: '+e.message,true);try{S.data=await api('init');NS.assignmentSync();NS.render()}catch(_){}}finally{NS.busy(false)}};

function rightsVisible(){const q=S.rightsSearch.trim().toLocaleLowerCase('th');return S.data.users.filter(x=>(!S.rightsGroup||x.group===S.rightsGroup)&&(!q||x.name.toLocaleLowerCase('th').includes(q)||x.username.toLocaleLowerCase('th').includes(q)));}
function rightsStaffRows(){return rightsVisible().map(u=>`<label><input type="checkbox" ${S.rightsSelected.has(u.username)?'checked':''} onchange="NS.rightsPick('${encodeURIComponent(u.username)}',this.checked)"><span style="flex:1"><b>${esc(u.name)}</b><br><small class="muted">${esc(u.group||'-')} · ${esc(u.username)}</small></span></label>`).join('')||'<div class="empty">ไม่พบบุคลากรที่ค้นหา</div>';}
function renderRights(){const visible=rightsVisible(),all=visible.length>0&&visible.every(u=>S.rightsSelected.has(u.username));return `<div class="card"><h2>กำหนดสิทธิของครูและบุคลากร</h2><div class="grid2"><label class="field"><span>กลุ่มสาระการเรียนรู้</span>${select('rights-group',groups(),S.rightsGroup,'ทุกกลุ่มสาระ')}</label><label class="field"><span>ค้นหาชื่อครู / บุคลากร</span><input class="input" type="search" id="rights-search" placeholder="ชื่อ-สกุล หรือชื่อผู้ใช้" value="${attr(S.rightsSearch)}" oninput="NS.rightsSearchChanged(this.value)"></label></div><div class="row" style="margin-bottom:12px"><button class="btn soft small" onclick="NS.rightsGroup()">กรองรายชื่อ</button><button class="btn gray small" onclick="NS.rightsClear()">ล้างการเลือกทั้งหมด</button></div><div class="row space" style="margin-bottom:8px"><label class="row" style="cursor:pointer"><input id="rights-all-visible" type="checkbox" style="width:18px;height:18px;accent-color:var(--blue)" ${all?'checked':''} onchange="NS.rightsAllVisible(this.checked)"> <b>เลือกทั้งหมดในรายการที่แสดง (${visible.length} คน)</b></label></div><div class="rights-checklist" id="rights-staff-list">${rightsStaffRows()}</div><p class="rights-selected" id="rights-count">เลือกไว้ ${S.rightsSelected.size} คน (ไม่จำกัดเฉพาะกลุ่มที่แสดง)</p><div class="row"><button class="btn gold" id="rights-apply" onclick="NS.openRights()">กำหนดสิทธิบุคลากรที่เลือก (${S.rightsSelected.size} คน)</button></div></div><div class="card"><h2>สิทธิที่กำหนดไว้</h2>${renderTable(['ชื่อผู้ใช้','กลุ่มสาระ','บันทึกคะแนน','รายงาน','พิจารณา','สอนแทน','คาบสอน','กิจกรรมและเวร','จัดตารางเวร'],S.data.perms.map(x=>[esc(x.username),esc(x.group),...x.flags.map(v=>v?'✓':'–')]))}</div>`;}
NS.rightsGroup=()=>{S.rightsGroup=val('rights-group');S.rightsSearch=val('rights-search');NS.render()};
NS.rightsSearchChanged=q=>{S.rightsSearch=q;NS.updateRightsList()};
NS.updateRightsList=()=>{const list=$('rights-staff-list');if(list)list.innerHTML=rightsStaffRows();const all=$('rights-all-visible');if(all){const shown=rightsVisible();all.checked=!!shown.length&&shown.every(x=>S.rightsSelected.has(x.username));all.indeterminate=!!shown.length&&!all.checked&&shown.some(x=>S.rightsSelected.has(x.username));}const count=$('rights-count');if(count)count.textContent=`เลือกไว้ ${S.rightsSelected.size} คน (ไม่จำกัดเฉพาะกลุ่มที่แสดง)`;const b=$('rights-apply');if(b)b.textContent=`กำหนดสิทธิบุคลากรที่เลือก (${S.rightsSelected.size} คน)`};
NS.rightsPick=(encoded,checked)=>{const username=decodeURIComponent(encoded);checked?S.rightsSelected.add(username):S.rightsSelected.delete(username);NS.updateRightsList()};
NS.rightsAllVisible=checked=>{rightsVisible().forEach(u=>checked?S.rightsSelected.add(u.username):S.rightsSelected.delete(u.username));NS.updateRightsList()};
NS.rightsClear=()=>{S.rightsSelected.clear();NS.updateRightsList()};
NS.openRights=()=>{const selected=[...S.rightsSelected];if(!selected.length){NS.toast('กรุณาเลือกครูหรือบุคลากรอย่างน้อย 1 คน',true);return}S._rightsUsers=selected;const keys=['saveScore','report','review','substitute','periods','attendance','roster'],names=['บันทึกคะแนน','รายงาน','พิจารณาผลปฏิบัติงาน','บันทึกสอนแทน','กำหนดจำนวนคาบสอน','บันทึกการปฏิบัติหน้าที่และเวรประจำวัน','จัดตารางเวรประจำวัน'];const single=selected.length===1,u=single?S.data.users.find(x=>x.username===selected[0]):null,p=single?S.data.perms.find(x=>x.username===selected[0]):null;NS.modal(single?'กำหนดสิทธิ: '+esc(u.name):`กำหนดสิทธิให้บุคลากร ${selected.length} คน`,`${single?'<p class="muted">ติ๊กเพื่ออนุญาตสิทธิ์ และเอาติ๊กออกเพื่อไม่อนุญาต</p>':'<div class="alert">กรณีเลือกหลายคน กำหนดต่อสิทธิ์ว่า “เปิดสิทธิ์”, “ปิดสิทธิ์” หรือ “ไม่เปลี่ยนสิทธิ์เดิม” เพื่อไม่แก้ไขสิทธิ์อื่นโดยไม่ตั้งใจ</div>'}<div class="checklist">${names.map((n,i)=>single?`<label><input id="perm-${i}" type="checkbox" ${p?.flags[i]?'checked':''}><span>${esc(n)}</span></label>`:`<label class="row space"><span>${esc(n)}</span><select id="perm-${i}" class="input" style="width:auto;min-width:145px"><option value="keep">ไม่เปลี่ยน</option><option value="allow">เปิดสิทธิ์</option><option value="deny">ปิดสิทธิ์</option></select></label>`).join('')}</div><div class="line"></div>${btn('บันทึกสิทธิ','NS.saveRights()','gold','')} ${btn('ยกเลิก','NS.closeModal()','gray','')}`)};
NS.saveRights=async()=>{const selected=S._rightsUsers||[],keys=['saveScore','report','review','substitute','periods','attendance','roster'];if(!selected.length)return;if(selected.length===1){const flags={};keys.forEach((k,i)=>flags[k]=$('perm-'+i).checked);NS.closeModal();try{await NS.call('setPermission',{username:selected[0],flags});S.rightsSelected.clear();NS.render()}catch(e){};return;}const flags={};keys.forEach((k,i)=>flags[k]=val('perm-'+i));if(keys.every(k=>flags[k]==='keep')){NS.toast('กรุณาเลือกสิทธิ์ที่ต้องการเปลี่ยนอย่างน้อยหนึ่งรายการ',true);return}NS.closeModal();NS.busy(true,'กำลังบันทึกสิทธิหลายบัญชี...');try{let count=0;for(let i=0;i<selected.length;i+=30){const result=await api('setPermissionsBulk',{usernames:selected.slice(i,i+30),flags});count+=result.count||0}Object.assign(S.data,await api('readPermissions'));S.rightsSelected.clear();NS.render();NS.toast('กำหนดสิทธิสำเร็จ '+count+' คน')}catch(e){NS.toast('อาจบันทึกบางส่วนแล้ว: '+e.message,true);try{S.data=await api('init');NS.render()}catch(_){}}finally{NS.busy(false)}};
function renderCriteriaAdmin(){
 const nav=[['criteria','เกณฑ์คะแนน'],['training','เกณฑ์ครั้งที่ 1–3 อบรม'],['award','ระดับผลงานรางวัล'],['volunteer','เกณฑ์จิตอาสา'],['max','คะแนนเต็มรายหมวด']];
 return `<div class="tabs">${nav.map(x=>tab(x[1],"NS.setCriteriaSubTab('"+x[0]+"')",S.criteriaSubTab===x[0])).join('')}</div>`+
 ({criteria:renderBaseCriteria,training:renderTrainingCountSettings,award:renderAwardLevelSettings,volunteer:renderVolunteerSettings,max:renderMaximumSettings})[S.criteriaSubTab]();
}
NS.setCriteriaSubTab=t=>{S.criteriaSubTab=t;NS.render()};
function renderBaseCriteria(){const items=S.data.criteria;return `<div class="card"><div class="row space"><h2>เกณฑ์คะแนน</h2><div class="row">${btn('+ เพิ่มรายการประเมิน','NS.criterionEditor()','gold')} ${btn('↓ เทมเพลต Excel','NS.excelTemplate(\'criteria\')')} <label class="btn soft small">↑ นำเข้า Excel<input type="file" accept=".xlsx,.xls" hidden onchange="NS.readExcel(this,\'criteria\')"></label></div></div><div class="alert">กำหนดคะแนนบวกหรือคะแนนหักตามเดิม แล้วนำเกณฑ์ด้านบวกไปผูกกับเกณฑ์นับครั้งหรือระดับผลงานรางวัล</div>${renderTable(['รายการประเมิน','หมวดหมู่','คะแนน','จัดการ'],items.map((x,i)=>[esc(x.item),esc(x.category),scoreLabel(x.score),btn('แก้ไข',"NS.criterionEditor("+i+")")+' '+btn('ลบ',"NS.deleteCriterion("+i+")",'red')]))}</div>`}
function renderMaximumSettings(){return `<div class="card"><h2>กำหนดคะแนนเต็มรายหมวดหมู่</h2><div class="grid2">${S.data.categories.map((c,i)=>`<label class="field"><span>${esc(c)}</span><input id="max-${i}" type="number" min="0" class="input" value="${S.data.maximums.find(x=>x.category===c)?.max||0}"></label>`).join('')}</div><div class="row space"><b>คะแนนเต็มรวมปัจจุบัน ${S.data.maximums.reduce((a,b)=>a+b.max,0)} คะแนน</b>${btn('บันทึกคะแนนเต็ม','NS.saveMax()','gold','')}</div></div>`}
function ruleCategorySelect(id,on){return `<label class="field"><span>หมวดหมู่</span><select id="${id}" class="input" onchange="${on}">${S.data.categories.map(c=>`<option value="${attr(c)}">${esc(c)}</option>`).join('')}</select></label>`}
function countPositiveCriteria(cat){return S.data.criteria.filter(x=>x.category===cat&&Number(x.score)>0)}
function renderTrainingCountSettings(){const rules=S.data.countRules||[];return `<div class="card"><h2>กำหนดคะแนนอบรม ตามจำนวนครั้งที่ผ่านการพิจารณา</h2><p class="muted">คะแนนครั้งที่ 1, 2 และ 3 คือ <b>คะแนนรวมปัจจุบัน</b> ไม่ใช่คะแนนที่บวกเพิ่มแต่ละครั้ง เมื่ออนุมัติครั้งที่ 2–3 ระบบจะแก้ไขคะแนนเดิม และครั้งที่ 4 เป็นต้นไปจะใช้คะแนนครั้งที่ 3 ตลอด โดยในแต่ละหมวดใช้เกณฑ์อบรมได้เพียงรายการเดียว</p><div class="grid2">${ruleCategorySelect('tc-category','NS.countRuleItems()')}<label class="field"><span>รายการเกณฑ์ที่จะให้ระบบเลือกอัตโนมัติ</span><select id="tc-item" class="input"></select></label></div><div class="grid2">${[1,2,3].map((n)=>`<label class="field"><span>คะแนนรวมเมื่อผ่านครั้งที่ ${n}</span><input class="input" type="number" id="tc-score-${n}" min="0" max="10000" step="0.01" value="${n}"></label>`).join('')}</div><div class="alert">ตัวอย่าง: ครั้งที่ 1 = 2, ครั้งที่ 2 = 5, ครั้งที่ 3 = 8 คะแนน เมื่อผ่านครั้งที่ 4, 5 หรือมากกว่านั้นยังคง 8 คะแนน • รายการเกณฑ์ไม่ปรากฏให้ผู้ใช้เลือกในฟอร์ม</div><div class="row">${btn('บันทึกเกณฑ์อบรมและใช้กับฟอร์ม','NS.saveCountRule()','gold','')}</div></div><div class="card"><h2>เกณฑ์ที่กำหนดไว้</h2>${renderTable(['หมวดหมู่','รายการประเมิน','ครั้งที่ 1','ครั้งที่ 2','ครั้งที่ 3','สถานะ','จัดการ'],rules.map((r,i)=>[esc(r.category),esc(r.item),scoreLabel(r.stage?.[0]||0),scoreLabel(r.stage?.[1]||0),scoreLabel(r.stage?.[2]||0),r.active?'กำลังใช้งาน':r.hasActive?'ไม่ได้ใช้งาน':'ข้อมูลเดิม (กรุณาตรวจสอบ)',btn('แก้ไข / ตั้งเป็นเกณฑ์หลัก',`NS.editCountRule(${i})`)]),'ยังไม่ได้กำหนดเกณฑ์อบรม')}</div>`}
NS.countRuleItems=()=>{const el=$('tc-item');if(!el)return;const items=countPositiveCriteria(val('tc-category'));el.innerHTML=items.map(x=>`<option value="${attr(x.item)}">${esc(x.item)} (+${x.score} คะแนนในเกณฑ์คะแนน)</option>`).join('');};
NS.editCountRule=i=>{const x=S.data.countRules[i];if(!x)return;$('tc-category').value=x.category;NS.countRuleItems();$('tc-item').value=x.item;[1,2,3].forEach(n=>{$('tc-score-'+n).value=x.stage?.[n-1]??0});window.scrollTo({top:0,behavior:'smooth'});};
NS.saveCountRule=async()=>{const d={category:val('tc-category'),item:val('tc-item'),score1:Number(val('tc-score-1')),score2:Number(val('tc-score-2')),score3:Number(val('tc-score-3'))};if(!d.item||[d.score1,d.score2,d.score3].some(v=>!Number.isFinite(v)||v<0)||d.score1>d.score2||d.score2>d.score3){NS.toast('กรุณากำหนดคะแนนทั้ง 3 ครั้งแบบไม่ลดลง',true);return}try{await NS.call('saveCountRule',d,'ตั้งค่าคะแนนอบรม 3 ขั้นแล้ว')}catch(e){}};
NS.deleteCountRule=async i=>{NS.toast('เพื่อรักษาประวัติคะแนนเดิม ให้แก้ไขและกำหนดเกณฑ์ที่ใช้งานแทนการลบ',true)};
const AWARD_LEVELS=['โรงเรียน','กลุ่มโรงเรียน','เขตพื้นที่การศึกษา','จังหวัด','ภาค','ประเทศ','นานาชาติ'];
function renderAwardLevelSettings(){const a=S.data.awardRules||[];return `<div class="card"><h2>กำหนดระดับผลงานรางวัลและรายการประเมิน</h2><p class="muted">สร้างความเชื่อมโยงระหว่างระดับรางวัลกับรายการเกณฑ์คะแนน สามารถกำหนดมากกว่าหนึ่งรายการต่อระดับได้</p><div class="grid2"><label class="field"><span>ระดับผลงานรางวัล</span><select class="input" id="ac-level" onchange="NS.awardCustomLevel()">${AWARD_LEVELS.map(x=>`<option value="${attr(x)}">${esc(x)}</option>`).join('')}<option value="__custom">อื่น ๆ (ระบุเอง)</option></select></label><label class="field"><span>ระดับรางวัลอื่น ๆ</span><input class="input" id="ac-custom" placeholder="ระบุชื่อระดับ" disabled></label></div><div class="grid2">${ruleCategorySelect('ac-category','NS.awardRuleItems()')}<label class="field"><span>รายการประเมิน / คะแนนตามเกณฑ์</span><select id="ac-item" class="input"></select></label></div><div class="row">${btn('เพิ่มรายการระดับรางวัล','NS.saveAwardRule()','gold','')}</div></div><div class="card"><h2>ระดับรางวัลที่กำหนดไว้</h2>${renderTable(['ระดับรางวัล','หมวดหมู่','รายการประเมิน','คะแนน','จัดการ'],a.map((x,i)=>[esc(x.level),esc(x.category),esc(x.item),scoreLabel(S.data.criteria.find(c=>c.category===x.category&&c.item===x.item)?.score||0),btn('ลบ',`NS.deleteAwardRule(${i})`,'red')]),'ยังไม่ได้กำหนดเกณฑ์รางวัล')}</div>`}
NS.awardCustomLevel=()=>{$('ac-custom').disabled=val('ac-level')!=='__custom';if(!$('ac-custom').disabled)$('ac-custom').focus()};
NS.awardRuleItems=()=>{const el=$('ac-item');if(!el)return;el.innerHTML=countPositiveCriteria(val('ac-category')).map(x=>`<option value="${attr(x.item)}">${esc(x.item)} (+${x.score} คะแนน)</option>`).join('')};
NS.saveAwardRule=async()=>{const level=val('ac-level')==='__custom'?val('ac-custom').trim():val('ac-level'),d={level,category:val('ac-category'),item:val('ac-item')};if(!d.level||!d.item){NS.toast('กรุณาระบุระดับรางวัลและรายการประเมิน',true);return}try{await NS.call('saveAwardRule',d,'เพิ่มเกณฑ์รางวัลแล้ว')}catch(e){}};
NS.deleteAwardRule=async i=>{const x=S.data.awardRules[i];if(x&&confirm('ยืนยันลบการจับคู่ '+x.level+' / '+x.item+' ?'))try{await NS.call('deleteAwardRule',x,'ลบเกณฑ์รางวัลแล้ว')}catch(e){}};
function renderVolunteerSettings(){const r=S.data.volunteerRule;return `<div class="card"><h2>ตั้งค่าเกณฑ์คะแนนงานจิตอาสา</h2><p class="muted">เลือกเกณฑ์ด้านบวกที่ใช้กับงานจิตอาสาเพียงหนึ่งรายการต่อระบบ กำหนดค่าเริ่มต้นครั้งละ 1 คะแนน และเพดานรวม 10 คะแนนต่อคน • ให้คะแนนหลังผ่านการพิจารณาเท่านั้น</p><div class="grid2">${ruleCategorySelect('vc-category','NS.volunteerRuleItems()')}<label class="field"><span>รายการเกณฑ์ที่ใช้คิดคะแนนอัตโนมัติ</span><select id="vc-item" class="input"></select></label><label class="field"><span>คะแนนต่อครั้งที่ผ่านพิจารณา</span><input id="vc-per" class="input" type="number" min="0.01" max="100" step="0.01" value="${r?.per||1}"></label><label class="field"><span>คะแนนสูงสุดต่อผู้ใช้</span><input id="vc-max" class="input" type="number" min="0.01" max="10000" step="0.01" value="${r?.max||10}"></label></div><div class="row">${btn('บันทึกเกณฑ์จิตอาสา','NS.saveVolunteerRule()','gold','')}</div>${r?`<div class="alert">ปัจจุบัน: ${esc(r.item)} · ${esc(r.category)} · ครั้งละ ${r.per} คะแนน · สูงสุด ${r.max} คะแนน</div>`:'<div class="alert">ยังไม่ได้ตั้งค่าเกณฑ์จิตอาสา จึงยังไม่เปิดให้บันทึก</div>'}</div>`}
NS.volunteerRuleItems=()=>{const el=$('vc-item');if(!el)return;el.innerHTML=countPositiveCriteria(val('vc-category')).map(x=>`<option value="${attr(x.item)}">${esc(x.item)}</option>`).join('')};
NS.saveVolunteerRule=async()=>{const d={category:val('vc-category'),item:val('vc-item'),per:Number(val('vc-per')),max:Number(val('vc-max'))};if(!d.item||!Number.isFinite(d.per)||!Number.isFinite(d.max)||d.per<=0||d.max<d.per){NS.toast('กรุณากรอกคะแนนต่อครั้งและคะแนนสูงสุดให้ถูกต้อง',true);return}try{await NS.call('saveVolunteerRule',d,'บันทึกเกณฑ์จิตอาสาแล้ว')}catch(e){}};
NS.criterionEditor=i=>{const x=S.data.criteria[i],cats=S.data.categories;S._editingCriterion=x?{item:x.item,category:x.category}:null;NS.modal(x?'แก้ไขเกณฑ์คะแนน':'เพิ่มเกณฑ์คะแนน',`<label class="field"><span>หมวดหมู่</span><select id="cr-cat" class="input">${cats.map(c=>`<option value="${attr(c)}" ${x?.category===c?'selected':''}>${esc(c)}</option>`).join('')}</select></label>${field('รายการประเมิน','cr-item','ระบุรายการประเมิน','text',x?.item||'')}${field('คะแนนด้านบวก (+) หรือด้านลบ (−)','cr-score','เช่น 5 หรือ -3','number',x?.score??'')}<div class="row">${btn('บันทึก','NS.saveCriterion()','gold','')} ${btn('ยกเลิก','NS.closeModal()','gray','')}</div>`)};
NS.saveCriterion=async()=>{const d={category:val('cr-cat'),item:val('cr-item'),score:Number(val('cr-score')),...(S._editingCriterion?{originalItem:S._editingCriterion.item,originalCategory:S._editingCriterion.category}:{})};NS.closeModal();try{await NS.call('saveCriterion',d)}catch(e){}};
NS.deleteCriterion=async i=>{const x=S.data.criteria[i];if(!x)return;if(confirm('ยืนยันลบรายการประเมิน '+x.item+'?'))try{await NS.call('deleteCriterion',x)}catch(e){}};
NS.saveMax=async()=>{const list=S.data.categories.map((category,i)=>({category,max:Number(val('max-'+i))}));NS.busy(true);try{for(const x of list)await api('setMax',x);S.data=await api('init');NS.render();NS.toast('บันทึกคะแนนเต็มเรียบร้อย')}catch(e){NS.toast(e.message,true)}finally{NS.busy(false)}};
function renderUsersAdmin(){return `<div class="card"><div class="row space"><h2>ข้อมูลผู้ใช้ในระบบ</h2>${btn('+ เพิ่มข้อมูลผู้ใช้ใหม่','NS.userEditor()','gold','')}</div><div class="filter-row"><input id="user-query" class="input" placeholder="ค้นหาชื่อ-สกุล / ชื่อผู้ใช้" oninput="NS.searchUsers(this.value)"></div><div id="users-table">${userTable('')}</div></div>`}
function userTable(q){q=q.trim().toLowerCase();return renderTable(['ชื่อ-สกุล / ตำแหน่ง','กลุ่มสาระ','ชื่อผู้ใช้','บทบาท','จัดการ'],S.data.users.filter(x=>x.name.toLowerCase().includes(q)||x.username.toLowerCase().includes(q)).map(x=>[esc(x.name)+'<br><small>'+esc(x.position)+'</small>',esc(x.group),esc(x.username),esc(x.role),btn('แก้ไข',"NS.userEditor('"+encodeURIComponent(x.username)+"')")+' '+btn('ลบ',"NS.deleteUser('"+encodeURIComponent(x.username)+"')",'red')]))}
NS.searchUsers=q=>{$('users-table').innerHTML=userTable(q)};
NS.userEditor=username=>{const x=S.data.users.find(v=>v.username===decodeURIComponent(username||''));S._userOriginal=x?.username||'';NS.modal(x?'แก้ไขข้อมูลผู้ใช้':'เพิ่มผู้ใช้ใหม่',`<div class="grid2">${field('ชื่อ-สกุล','u-name','ชื่อ-สกุล','text',x?.name||'')}${field('ตำแหน่ง','u-position','ตำแหน่ง','text',x?.position||'')}${field('กลุ่มสาระการเรียนรู้ / สายงาน','u-group','กลุ่มสาระ','text',x?.group||'')}${field('ชื่อผู้ใช้','u-username','ชื่อผู้ใช้','text',x?.username||'')}${field('รหัสผ่าน '+(x?'(ว่างไว้หากไม่เปลี่ยน)':''),'u-password','อย่างน้อย 8 ตัวอักษร','password')}<label class="field"><span>บทบาท</span><select id="u-role" class="input">${S.data.roles.map(r=>`<option value="${attr(r)}" ${x?.role===r?'selected':''}>${esc(r)}</option>`).join('')}</select></label></div>${btn('บันทึกข้อมูลผู้ใช้','NS.saveUser()','gold','')}`)};
NS.saveUser=async()=>{const p=val('u-password');if(p&&p.length<8){NS.toast('รหัสผ่านต้องมีอย่างน้อย 8 ตัวอักษร',true);return}const data={name:val('u-name'),position:val('u-position'),group:val('u-group'),username:val('u-username'),passwordHash:p?await digest(p):'',role:val('u-role'),original:S._userOriginal};NS.closeModal();try{await NS.call('saveUser',data)}catch(e){}};
NS.deleteUser=async n=>{const username=decodeURIComponent(n);if(confirm('ยืนยันลบบัญชี '+username+'?'))try{await NS.call('deleteUser',{username})}catch(e){}};
function renderAllowed(){return `<div class="card"><h2>หมวดหมู่และรายการประเมินที่บทบาท User ใช้งานได้</h2><p class="muted" style="margin-bottom:15px">ติ๊กถูกเพื่อเปิดให้ผู้ใช้ทั่วไปส่งผลงานสำหรับรายการนั้น ระบบบันทึกค่าแยกตามรายการประเมิน</p><div class="checklist">${S.data.criteria.map((x,i)=>{const enabled=S.data.allowed.some(a=>a.category===x.category&&a.item===x.item&&a.enabled);return `<label><input type="checkbox" ${enabled?'checked':''} onchange="NS.allowCriterion(${i},this.checked)"><span style="flex:1">${esc(x.item)}<br><small class="muted">${esc(x.category)}</small></span>${scoreLabel(x.score)}</label>`}).join('')||'<p class="empty">กรุณากำหนดเกณฑ์คะแนนก่อน</p>'}</div></div>`}
NS.allowCriterion=async(i,enabled)=>{const x=S.data.criteria[i];try{await NS.call('allowCriterion',{category:x.category,item:x.item,enabled},'อัปเดตสิทธิรายการประเมินแล้ว')}catch(e){}};
NS.openProfile=()=>{const u=S.data.user;NS.modal('เปลี่ยนชื่อผู้ใช้และรหัสผ่าน',`${field('ชื่อผู้ใช้ใหม่','profile-name','ชื่อผู้ใช้','text',u.username)}${field('รหัสผ่านใหม่ (เว้นว่างไว้หากไม่เปลี่ยน)','profile-pass','อย่างน้อย 8 ตัวอักษร','password')}<div class="alert">ระบบจะให้ออกจากระบบหลังบันทึกและเข้าสู่ระบบใหม่</div>${btn('บันทึกการเปลี่ยนแปลง','NS.saveProfile()','gold','')}`)};
NS.saveProfile=async()=>{const d={username:val('profile-name'),passwordHash:val('profile-pass')?await digest(val('profile-pass')):''};NS.busy(true);try{if(val('profile-pass')&&val('profile-pass').length<8)throw Error('รหัสผ่านต้องมีอย่างน้อย 8 ตัวอักษร');await api('profile',d);NS.closeModal();NS.logout();NS.toast('เปลี่ยนข้อมูลแล้ว กรุณาเข้าสู่ระบบใหม่')}catch(e){NS.toast(e.message,true)}finally{NS.busy(false)}};
function availableWorkCriteria(){return S.data.user.role==='User'?S.data.criteria.filter(x=>S.data.allowed.some(a=>a.category===x.category&&a.item===x.item&&a.enabled)):S.data.criteria}
function availableTrainingCriteria(){const rules=S.data.countRules||[];return availableWorkCriteria().filter(x=>x.score>0&&rules.some(r=>r.category===x.category&&r.item===x.item&&(r.active||(!r.hasActive&&rules.filter(z=>z.category===r.category).length===1))))}
function availableAwardRules(){return (S.data.awardRules||[]).filter(r=>availableWorkCriteria().some(x=>x.category===r.category&&x.item===r.item&&x.score>0))}
function availableVolunteerRule(){const r=S.data.volunteerRule;return r&&availableWorkCriteria().some(x=>x.category===r.category&&x.item===r.item&&x.score>0)?r:null}
NS.openWork=()=>{
  const trainings=availableTrainingCriteria(),awards=availableAwardRules(),volunteer=availableVolunteerRule();
  if(!trainings.length&&!awards.length&&!volunteer){NS.toast('ยังไม่มีเกณฑ์อบรม รางวัล หรืองานจิตอาสาที่เปิดให้ใช้งาน กรุณาติดต่อผู้ดูแลระบบ',true);return}
  NS.releaseAwardPreview();S.workTab=trainings.length?'training':awards.length?'award':'volunteer';
  const cats=[...new Set(trainings.map(x=>x.category))],levels=[...new Set(awards.map(x=>x.level))];
  NS.modal('บันทึกผลการปฏิบัติงาน',`<div class="work-kind-tabs"><button id="tab-training" type="button" class="tab" onclick="NS.workTabChange('training')" ${!trainings.length?'disabled':''}>1. ประชุม/อบรม/สัมมนาพัฒนาวิชาชีพ</button><button id="tab-award" type="button" class="tab" onclick="NS.workTabChange('award')" ${!awards.length?'disabled':''}>2. ผลงานรางวัล</button><button id="tab-volunteer" type="button" class="tab" onclick="NS.workTabChange('volunteer')" ${!volunteer?'disabled':''}>3. งานจิตอาสา</button></div>
  <section id="work-training" class="work-form-panel"><label class="field"><span>หมวดหมู่ตามเกณฑ์อบรม</span><select id="w-category" class="input" onchange="NS.workItems()">${cats.map(c=>`<option value="${attr(c)}">${esc(c)}</option>`).join('')}</select></label><div class="award-points" id="work-count-info"></div>
  ${field('ชื่องานหรือโครงการ','w-title','ชื่องาน / โครงการ')}${field('หน่วยงานที่จัด','w-agency','หน่วยงาน')}${field('เริ่มดำเนินงาน','w-start','','date')}${field('สิ้นสุดการดำเนินงาน','w-end','','date')}<label class="field"><span>รายละเอียดการปฏิบัติงาน</span><textarea id="w-details" placeholder="อธิบายภารกิจที่ดำเนินการ"></textarea></label><label class="field"><span>ผลการปฏิบัติงาน</span><textarea id="w-result" placeholder="ระบุผลสัมฤทธิ์"></textarea></label><label class="field"><span>แนบภาพหลักฐาน (สูงสุด 3 รูป)</span><input id="w-photos" class="input" type="file" accept="image/*" multiple><small class="muted">ย่อภาพอัตโนมัติและอัปโหลดเร็วขึ้น · จัดเก็บเป็นลิงก์ Google Drive</small></label><div class="row">${btn('บันทึกและส่งพิจารณา','NS.saveWork()','gold','')} ${btn('ยกเลิก','NS.closeModal()','gray','')}</div></section>
  <section id="work-award" class="work-form-panel"><label class="field"><span>เลือกผลงานระดับ</span><select id="aw-level" class="input" onchange="NS.awardLevelChanged()">${levels.map(c=>`<option value="${attr(c)}">${esc(c)}</option>`).join('')}</select></label><div class="grid2"><label class="field"><span>รายการประเมินตามระดับรางวัล</span><select id="aw-item" class="input" onchange="NS.awardScoreChanged()"></select></label><div class="award-points" id="aw-score">คะแนนตามเกณฑ์</div></div>
  ${field('ชื่อรางวัล / ชื่อผลงาน','aw-title','ระบุชื่อรางวัลที่ได้รับ')}${field('หน่วยงานที่จัด','aw-agency','หน่วยงานผู้มอบรางวัล')}${field('ระหว่างวันที่ (เริ่มต้น)','aw-start','','date')}${field('ระหว่างวันที่ (สิ้นสุด)','aw-end','','date')}
  <label class="field"><span>รูปหลักฐาน / เกียรติบัตร / โล่รางวัล (อย่างน้อย 3 รูป)</span><input id="aw-photos" class="input" type="file" accept="image/*" multiple onchange="NS.previewAwardPhotos()"><small class="muted">รองรับ 3–12 รูปต่อผลงาน · ภาพแสดงตัวอย่างก่อนส่ง · ย่อไฟล์และส่งขึ้น Google Drive เป็นชุด</small></label><div id="aw-photo-count" class="muted">ยังไม่ได้เลือกรูปภาพ</div><div id="aw-photo-preview" class="award-preview" aria-live="polite"></div><div class="row">${btn('บันทึกผลงานรางวัลและส่งพิจารณา','NS.saveWork()','gold','')} ${btn('ยกเลิก','NS.closeModal()','gray','')}</div></section>
  <section id="work-volunteer" class="work-form-panel"><div class="award-points">${volunteer?`เกณฑ์: ${esc(volunteer.item)} · เมื่อผ่านพิจารณา ครั้งละ ${volunteer.per} คะแนน สูงสุด ${volunteer.max} คะแนนต่อคน`:'ยังไม่ได้กำหนดเกณฑ์จิตอาสา'}</div>${field('ชื่อกิจกรรม','vo-title','ระบุชื่อกิจกรรม')}${field('สถานที่','vo-location','สถานที่จัดกิจกรรม')}${field('หน่วยงานที่จัด','vo-agency','หน่วยงานที่จัด')}${field('ระหว่างวันที่ (เริ่มต้น)','vo-start','','date')}${field('ระหว่างวันที่ (สิ้นสุด)','vo-end','','date')}<label class="field"><span>รูปหลักฐาน / เกียรติบัตร / โล่รางวัล (อย่างน้อย 3 รูป)</span><input id="vo-photos" class="input" type="file" accept="image/*" multiple onchange="NS.previewVolunteerPhotos()"><small class="muted">รองรับ 3–12 รูป · มีตัวอย่างก่อนส่ง · จัดเก็บเป็นลิงก์ Google Drive</small></label><div id="vo-photo-count" class="muted">ยังไม่ได้เลือกรูปภาพ</div><div id="vo-photo-preview" class="award-preview" aria-live="polite"></div><div class="row">${btn('บันทึกงานจิตอาสาและส่งพิจารณา','NS.saveWork()','gold','')} ${btn('ยกเลิก','NS.closeModal()','gray','')}</div></section>`);

// NS360 v27: ย่อภาพเพียงครั้งเดียวบนอุปกรณ์ แล้วอัปโหลดเป็นชุด (Google Apps Script Fast)
async function compressImage(file){
 if(!file||!String(file.type||'').startsWith('image/'))throw Error('รองรับเฉพาะรูปภาพ');
 if(file.size>15*1024*1024)throw Error('ภาพใหญ่เกิน 15 MB กรุณาลดขนาดภาพก่อน');
 const url=URL.createObjectURL(file);
 let img;
 try{
  img=await new Promise((resolve,reject)=>{
   const node=new Image();node.onload=()=>resolve(node);
   node.onerror=()=>reject(Error('เบราว์เซอร์เปิดรูปนี้ไม่ได้ กรุณาใช้ JPEG หรือ PNG'));
   node.src=url;
  });
  // ลดขนาดสูงสุดก่อนแปลง เพื่อลดข้อมูลจากรูปถ่ายมือถือขนาดใหญ่
  const scale=Math.min(1,1200/Math.max(img.naturalWidth||img.width,img.naturalHeight||img.height));
  const c=document.createElement('canvas');
  c.width=Math.max(1,Math.round((img.naturalWidth||img.width)*scale));
  c.height=Math.max(1,Math.round((img.naturalHeight||img.height)*scale));
  const ctx=c.getContext('2d',{alpha:false});if(!ctx)throw Error('อุปกรณ์ไม่รองรับการย่อรูป');
  ctx.fillStyle='#ffffff';ctx.fillRect(0,0,c.width,c.height);
  ctx.drawImage(img,0,0,c.width,c.height);
  let blob;
  for(const quality of [.70,.60,.50]){
   blob=await new Promise((resolve,reject)=>c.toBlob(b=>b?resolve(b):reject(Error('บีบอัดรูปภาพไม่สำเร็จ')),'image/jpeg',quality));
   if(blob.size<=300000)break;
  }
  if(blob.size>335000)throw Error('ไฟล์รูปยังมีขนาดใหญ่หลังบีบอัด กรุณาลดขนาดภาพแล้วลองอีกครั้ง');
  return await new Promise((resolve,reject)=>{
   const reader=new FileReader();reader.onload=()=>resolve(String(reader.result).split(',')[1]);
   reader.onerror=()=>reject(Error('อ่านไฟล์รูปภาพไม่สำเร็จ'));
   reader.readAsDataURL(blob);
  });
 }finally{URL.revokeObjectURL(url)}
}
// ใช้เฉพาะการโฮสต์ภายนอก: JSONP ไม่สามารถส่งรูปเป็นชุดใหญ่ได้
async function uploadPreparedLegacy(encoded,i,total){
 const partSize=3000,n=Math.ceil(encoded.length/partSize);
 const id='ns360_'+Date.now()+'_'+Math.random().toString(36).slice(2);
 if(n>151)throw Error('ภาพที่ '+i+' ใหญ่เกินขนาดที่ระบบภายนอกรองรับ');
 let next=0,done=0;
 async function worker(){while(next<n){const k=next++;
  const d={id,index:k,chunk:encoded.slice(k*partSize,(k+1)*partSize)};
  let successful=false;
  for(let attempt=0;attempt<2;attempt++){
   try{await api('uploadChunk',d);successful=true;break}catch(error){
    if(attempt||/สิทธิ์|หมดอายุ|ไม่ถูกต้อง/.test(error.message))throw error;
    await new Promise(ok=>setTimeout(ok,400));
   }
  }
  if(!successful)throw Error('อัปโหลดส่วนของรูปไม่สำเร็จ');
  done++;NS.busy(true,`กำลังส่งภาพ ${i}/${total} (${done}/${n} ส่วน)`);
 }}
 await Promise.all(Array.from({length:Math.min(2,n)},worker));
 const r=await api('finishUpload',{id,count:n,mime:'image/jpeg'});return r.url;
}
async function uploadPhotosFast(input){
 const files=Array.from(input||[]),n=files.length;
 if(!n)return [];
 if(n>12)throw Error('อัปโหลดได้สูงสุด 12 รูปต่อครั้ง');
 const compressed=new Array(n);let nextEncode=0,encodedCount=0;
 NS.busy(true,`กำลังเตรียมรูปภาพ 0/${n}`);
 // เตรียมภาพทีละ 2 เพื่อลดการใช้ RAM บนสมาร์ทโฟน
 await Promise.all(Array.from({length:Math.min(2,n)},async()=>{
  while(nextEncode<n){const i=nextEncode++;
   compressed[i]=await compressImage(files[i]);encodedCount++;
   NS.busy(true,`ย่อรูปภาพแล้ว ${encodedCount}/${n}`);
  }
 }));
 const urls=new Array(n);
 if(NS_NATIVE){
  const batches=[];
  for(let i=0;i<n;i+=3)batches.push({first:i,items:compressed.slice(i,i+3).map(encoded=>({encoded,mime:'image/jpeg'}))});
  let nextBatch=0,uploaded=0;
  // สองคำขอพร้อมกัน ไม่สร้างคำขอมากเกินสำหรับผู้ใช้หลายสิบคน
  await Promise.all(Array.from({length:Math.min(2,batches.length)},async()=>{
   while(nextBatch<batches.length){const batch=batches[nextBatch++];
    const r=await api('uploadBatch',{photos:batch.items});
    if(!Array.isArray(r?.urls)||r.urls.length!==batch.items.length||r.urls.some(x=>!x))throw Error('เซิร์ฟเวอร์ตอบกลับลิงก์รูปภาพไม่ครบ');
    r.urls.forEach((url,j)=>{urls[batch.first+j]=url});uploaded+=r.urls.length;
    NS.busy(true,`บันทึกรูปขึ้น Google Drive แล้ว ${uploaded}/${n}`);
   }
  }));
 }else{
  // สำหรับเว็บภายนอกคงเส้นทาง JSONP เดิม แต่ลดขนาดภาพและส่งส่วนย่อยพร้อมกัน
  let nextFile=0;
  await Promise.all(Array.from({length:Math.min(2,n)},async()=>{
   while(nextFile<n){const i=nextFile++;urls[i]=await uploadPreparedLegacy(compressed[i],i+1,n)}
  }));
 }
 return urls;
}

 NS.busy(true,'กำลังนำเข้าตารางเวร');let count=0;try{for(let i=0;i<items.length;i+=20){const x=await api('importDutyRoster',{items:items.slice(i,i+20)});count+=x.count||0}Object.assign(S.data,await api('readDutyRoster'));NS.render();NS.toast('นำเข้าสำเร็จ '+count+' รายการ')}catch(e){Object.assign(S.data,await api('readDutyRoster'));NS.render();NS.toast('นำเข้าแล้ว '+count+' รายการก่อนเกิดข้อผิดพลาด: '+e.message,true)}finally{NS.busy(false)}}catch(e){NS.toast(e.message,true)}finally{input.value=''}};
